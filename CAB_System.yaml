openapi: 3.0.3
info:
  title: CAB System API
  description: |
    API cho nền tảng đặt xe CAB System của Công ty ABC.
    Phạm vi được xây dựng theo đặc tả nghiệp vụ và Use Case của dự án.
    Hệ thống hỗ trợ khách hàng, tài xế, nhân viên vận hành và ban giám đốc.
  version: 1.0.0
  contact:
    name: ABC - CAB System

servers:
  - url: https://api.example.com/api/v1
    description: Production
  - url: http://localhost:8080/api/v1
    description: Local development

tags:
  - name: Authentication
    description: Đăng ký, đăng nhập và xác thực
  - name: Customers
    description: Quản lý khách hàng
  - name: Drivers
    description: Quản lý tài xế
  - name: Vehicles
    description: Quản lý phương tiện
  - name: Rides
    description: Đặt và quản lý chuyến đi
  - name: Driver Matching
    description: Tìm và phân công tài xế
  - name: Tracking
    description: Theo dõi vị trí và trạng thái chuyến
  - name: Payments
    description: Tính cước và thanh toán
  - name: Notifications
    description: Thông báo
  - name: Ratings
    description: Đánh giá tài xế
  - name: Operations
    description: Chức năng vận hành
  - name: Reports
    description: Báo cáo và thống kê

security:
  - bearerAuth: []

paths:

  /auth/register:
    post:
      tags: [Authentication]
      summary: Đăng ký tài khoản
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Đăng ký thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Tài khoản đã tồn tại

  /auth/login:
    post:
      tags: [Authentication]
      summary: Đăng nhập
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Đăng xuất
      responses:
        '204':
          description: Đăng xuất thành công
        '401':
          $ref: '#/components/responses/Unauthorized'

  /customers/me:
    get:
      tags: [Customers]
      summary: Xem thông tin cá nhân
      responses:
        '200':
          description: Thông tin khách hàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
    put:
      tags: [Customers]
      summary: Cập nhật thông tin cá nhân
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomerUpdateRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'

  /customers:
    get:
      tags: [Customers]
      summary: Tra cứu khách hàng
      description: Dành cho nhân viên vận hành có quyền quản lý khách hàng.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: keyword
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Danh sách khách hàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedCustomers'

  /drivers/me:
    get:
      tags: [Drivers]
      summary: Xem hồ sơ tài xế
      responses:
        '200':
          description: Hồ sơ tài xế
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
    put:
      tags: [Drivers]
      summary: Cập nhật hồ sơ tài xế
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverUpdateRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'

  /drivers/me/status:
    patch:
      tags: [Drivers]
      summary: Cập nhật trạng thái hoạt động/sẵn sàng
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverStatusRequest'
      responses:
        '200':
          description: Cập nhật trạng thái thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'

  /drivers/me/location:
    post:
      tags: [Tracking]
      summary: Cập nhật vị trí tài xế
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationUpdateRequest'
      responses:
        '204':
          description: Đã cập nhật vị trí

  /drivers:
    get:
      tags: [Drivers]
      summary: Quản lý và tra cứu tài xế
      description: Dành cho nhân viên vận hành.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/DriverStatus'
        - name: keyword
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Danh sách tài xế
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedDrivers'
    post:
      tags: [Drivers]
      summary: Tạo tài khoản tài xế
      description: Nhân viên vận hành có thể tạo tài khoản cho tài xế.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverCreateRequest'
      responses:
        '201':
          description: Tạo tài khoản thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'

  /vehicles:
    get:
      tags: [Vehicles]
      summary: Danh sách phương tiện
      responses:
        '200':
          description: Danh sách phương tiện
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehicle'
    post:
      tags: [Vehicles]
      summary: Thêm phương tiện
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleCreateRequest'
      responses:
        '201':
          description: Thêm phương tiện thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'

  /vehicles/{vehicleId}:
    parameters:
      - $ref: '#/components/parameters/VehicleId'
    get:
      tags: [Vehicles]
      summary: Xem phương tiện
      responses:
        '200':
          description: Thông tin phương tiện
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Vehicles]
      summary: Cập nhật phương tiện
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VehicleCreateRequest'
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'

  /rides:
    post:
      tags: [Rides]
      summary: Đặt xe
      description: |
        Khách hàng nhập điểm đón, điểm đến, chọn loại xe và tạo yêu cầu.
        Sau khi tạo, hệ thống chuyển sang quá trình tìm và phân công tài xế.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRideRequest'
      responses:
        '201':
          description: Tạo yêu cầu đặt xe thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
        '400':
          $ref: '#/components/responses/BadRequest'

    get:
      tags: [Rides]
      summary: Xem lịch sử chuyến đi
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/RideStatus'
      responses:
        '200':
          description: Danh sách chuyến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedRides'

  /rides/{rideId}:
    parameters:
      - $ref: '#/components/parameters/RideId'
    get:
      tags: [Rides]
      summary: Xem thông tin chuyến
      responses:
        '200':
          description: Thông tin chuyến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
        '404':
          $ref: '#/components/responses/NotFound'

  /rides/{rideId}/cancel:
    post:
      tags: [Rides]
      summary: Hủy chuyến
      description: Chính sách hủy chuyến cần được BA xác nhận với khách hàng.
      parameters:
        - $ref: '#/components/parameters/RideId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelRideRequest'
      responses:
        '200':
          description: Hủy chuyến thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
        '409':
          description: Không thể hủy chuyến theo trạng thái hiện tại

  /rides/{rideId}/matching:
    post:
      tags: [Driver Matching]
      summary: Bắt đầu tìm tài xế
      description: |
        Tìm tài xế dựa trên vị trí, trạng thái sẵn sàng, loại xe và tiêu chí ưu tiên.
        Nếu tài xế từ chối hoặc không phản hồi, hệ thống tiếp tục tìm tài xế khác.
      parameters:
        - $ref: '#/components/parameters/RideId'
      responses:
        '202':
          description: Đã bắt đầu quá trình tìm tài xế
        '404':
          description: Không tìm được tài xế phù hợp

  /rides/{rideId}/driver-response:
    post:
      tags: [Driver Matching]
      summary: Tài xế chấp nhận hoặc từ chối chuyến
      parameters:
        - $ref: '#/components/parameters/RideId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverResponseRequest'
      responses:
        '200':
          description: Đã ghi nhận phản hồi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'

  /rides/{rideId}/status:
    patch:
      tags: [Rides]
      summary: Cập nhật trạng thái chuyến
      description: |
        Tài xế cập nhật theo trình tự:
        Đang đến điểm đón -> Đã đến điểm đón -> Đã đón khách ->
        Đang di chuyển -> Hoàn thành.
      parameters:
        - $ref: '#/components/parameters/RideId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RideStatusUpdateRequest'
      responses:
        '200':
          description: Cập nhật trạng thái thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'

  /rides/{rideId}/tracking:
    get:
      tags: [Tracking]
      summary: Theo dõi vị trí và trạng thái chuyến
      parameters:
        - $ref: '#/components/parameters/RideId'
      responses:
        '200':
          description: Thông tin theo dõi chuyến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackingInfo'

  /rides/{rideId}/fare:
    get:
      tags: [Payments]
      summary: Tính và xem cước chuyến
      description: Công thức tính cước chưa được khách hàng chốt và cần BA làm rõ.
      parameters:
        - $ref: '#/components/parameters/RideId'
      responses:
        '200':
          description: Thông tin cước
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Fare'

  /rides/{rideId}/payments:
    post:
      tags: [Payments]
      summary: Thanh toán chuyến đi
      description: |
        Hỗ trợ tiền mặt và thanh toán điện tử.
        CAB không lưu trực tiếp thông tin nhạy cảm của thẻ/tài khoản.
      parameters:
        - $ref: '#/components/parameters/RideId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Kết quả thanh toán
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '402':
          description: Thanh toán thất bại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'

  /rides/{rideId}/payments/retry:
    post:
      tags: [Payments]
      summary: Thử lại thanh toán
      description: Cho phép xử lý lại khi thanh toán điện tử thất bại theo chính sách doanh nghiệp.
      parameters:
        - $ref: '#/components/parameters/RideId'
      responses:
        '200':
          description: Kết quả xử lý lại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'

  /rides/{rideId}/rating:
    post:
      tags: [Ratings]
      summary: Đánh giá tài xế
      description: Chỉ cho phép đánh giá sau khi chuyến đã hoàn thành.
      parameters:
        - $ref: '#/components/parameters/RideId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RatingRequest'
      responses:
        '201':
          description: Đánh giá được lưu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rating'
        '409':
          description: Chuyến chưa hoàn thành hoặc đã được đánh giá

  /notifications:
    post:
      tags: [Notifications]
      summary: Gửi thông báo
      description: |
        Gửi thông báo thông qua nhà cung cấp bên ngoài.
        Kiến trúc cho phép bổ sung thêm kênh hoặc nhà cung cấp trong tương lai.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotificationRequest'
      responses:
        '202':
          description: Đã tiếp nhận yêu cầu gửi thông báo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'

  /operations/rides:
    get:
      tags: [Operations]
      summary: Quản lý chuyến đi
      description: Dành cho nhân viên vận hành có quyền quản lý chuyến.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/RideStatus'
        - name: keyword
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Danh sách chuyến
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedRides'

  /operations/rides/{rideId}/incident:
    post:
      tags: [Operations]
      summary: Ghi nhận và xử lý sự cố chuyến
      parameters:
        - $ref: '#/components/parameters/RideId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IncidentRequest'
      responses:
        '200':
          description: Đã ghi nhận xử lý sự cố
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Incident'

  /operations/transactions:
    get:
      tags: [Operations]
      summary: Tra cứu lịch sử giao dịch
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: paymentStatus
          in: query
          schema:
            $ref: '#/components/schemas/PaymentStatus'
      responses:
        '200':
          description: Danh sách giao dịch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedPayments'

  /reports:
    get:
      tags: [Reports]
      summary: Xem báo cáo hoạt động
      description: |
        Báo cáo gồm số chuyến, doanh thu, tỷ lệ hoàn thành,
        tỷ lệ hủy và hiệu quả hoạt động của tài xế.
      parameters:
        - name: reportType
          in: query
          required: true
          schema:
            type: string
            enum:
              - ride_count
              - revenue
              - completion_rate
              - cancellation_rate
              - driver_performance
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Báo cáo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '400':
          description: Khoảng thời gian không hợp lệ

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    RideId:
      name: rideId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VehicleId:
      name: vehicleId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Dữ liệu không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Chưa xác thực hoặc thông tin xác thực không hợp lệ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Không có quyền thực hiện thao tác
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Không tìm thấy dữ liệu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:

    RegisterRequest:
      type: object
      required: [fullName, phone, password, role]
      properties:
        fullName:
          type: string
          example: Nguyễn Văn A
        phone:
          type: string
          example: "0901234567"
        password:
          type: string
          format: password
          example: "StrongPassword123!"
        role:
          type: string
          enum: [CUSTOMER, DRIVER]

    LoginRequest:
      type: object
      required: [phone, password]
      properties:
        phone:
          type: string
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          example: 3600
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        phone:
          type: string
        role:
          type: string
          enum: [CUSTOMER, DRIVER, OPERATION_STAFF, MANAGEMENT]
        active:
          type: boolean

    Customer:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            email:
              type: string
              format: email
            address:
              type: string

    CustomerUpdateRequest:
      type: object
      properties:
        fullName:
          type: string
        email:
          type: string
          format: email
        address:
          type: string

    Driver:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            licenseNumber:
              type: string
            status:
              $ref: '#/components/schemas/DriverStatus'
            vehicle:
              $ref: '#/components/schemas/Vehicle'

    DriverCreateRequest:
      type: object
      required: [fullName, phone, licenseNumber]
      properties:
        fullName:
          type: string
        phone:
          type: string
        licenseNumber:
          type: string
        vehicleId:
          type: string
          format: uuid

    DriverUpdateRequest:
      type: object
      properties:
        fullName:
          type: string
        licenseNumber:
          type: string

    DriverStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/DriverStatus'

    DriverStatus:
      type: string
      enum:
        - OFFLINE
        - AVAILABLE
        - BUSY
        - SUSPENDED

    Vehicle:
      type: object
      properties:
        id:
          type: string
          format: uuid
        plateNumber:
          type: string
          example: 51A-123.45
        vehicleType:
          type: string
          enum: [MOTORBIKE, CAR_4_SEATS, CAR_7_SEATS]
        active:
          type: boolean

    VehicleCreateRequest:
      type: object
      required: [plateNumber, vehicleType]
      properties:
        plateNumber:
          type: string
        vehicleType:
          type: string
          enum: [MOTORBIKE, CAR_4_SEATS, CAR_7_SEATS]
        driverId:
          type: string
          format: uuid

    Location:
      type: object
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          format: double
          example: 10.7769
        longitude:
          type: number
          format: double
          example: 106.7009
        address:
          type: string
          example: Quận 1, TP. Hồ Chí Minh

    LocationUpdateRequest:
      allOf:
        - $ref: '#/components/schemas/Location'
        - type: object
          properties:
            recordedAt:
              type: string
              format: date-time

    CreateRideRequest:
      type: object
      required: [pickup, destination, vehicleType]
      properties:
        pickup:
          $ref: '#/components/schemas/Location'
        destination:
          $ref: '#/components/schemas/Location'
        vehicleType:
          type: string
          enum: [MOTORBIKE, CAR_4_SEATS, CAR_7_SEATS]
        paymentMethod:
          type: string
          enum: [CASH, ELECTRONIC]
          default: CASH

    Ride:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
          nullable: true
        pickup:
          $ref: '#/components/schemas/Location'
        destination:
          $ref: '#/components/schemas/Location'
        vehicleType:
          type: string
        status:
          $ref: '#/components/schemas/RideStatus'
        estimatedArrivalMinutes:
          type: integer
          nullable: true
        fare:
          type: number
          format: double
          nullable: true
        createdAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true

    RideStatus:
      type: string
      enum:
        - REQUESTED
        - SEARCHING_DRIVER
        - DRIVER_ASSIGNED
        - DRIVER_ARRIVING
        - DRIVER_ARRIVED
        - PASSENGER_PICKED_UP
        - IN_PROGRESS
        - COMPLETED
        - CANCELLED
        - NO_DRIVER_FOUND

    DriverResponseRequest:
      type: object
      required: [response]
      properties:
        response:
          type: string
          enum: [ACCEPT, REJECT]
        reason:
          type: string
          nullable: true

    RideStatusUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/RideStatus'

    TrackingInfo:
      type: object
      properties:
        rideId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/RideStatus'
        driver:
          $ref: '#/components/schemas/Driver'
        driverLocation:
          $ref: '#/components/schemas/Location'
        estimatedArrivalMinutes:
          type: integer
          nullable: true
        updatedAt:
          type: string
          format: date-time

    Fare:
      type: object
      properties:
        rideId:
          type: string
          format: uuid
        serviceType:
          type: string
        baseFare:
          type: number
          format: double
        distanceFare:
          type: number
          format: double
        timeFare:
          type: number
          format: double
        total:
          type: number
          format: double
        currency:
          type: string
          example: VND

    PaymentRequest:
      type: object
      required: [method]
      properties:
        method:
          type: string
          enum: [CASH, ELECTRONIC]
        paymentProvider:
          type: string
          nullable: true
          description: Nhà cung cấp thanh toán bên ngoài, nếu sử dụng thanh toán điện tử.
        paymentToken:
          type: string
          nullable: true
          description: Token do nhà cung cấp thanh toán cấp; không gửi số thẻ hoặc dữ liệu nhạy cảm trực tiếp vào CAB.

    Payment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        rideId:
          type: string
          format: uuid
        amount:
          type: number
          format: double
        method:
          type: string
          enum: [CASH, ELECTRONIC]
        status:
          $ref: '#/components/schemas/PaymentStatus'
        transactionReference:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    PaymentStatus:
      type: string
      enum:
        - PENDING
        - PAID
        - FAILED
        - RETRY_REQUIRED

    RatingRequest:
      type: object
      required: [score]
      properties:
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true

    Rating:
      type: object
      properties:
        id:
          type: string
          format: uuid
        rideId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
        score:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    CancelRideRequest:
      type: object
      properties:
        reason:
          type: string

    NotificationRequest:
      type: object
      required: [recipientId, eventType, message]
      properties:
        recipientId:
          type: string
          format: uuid
        eventType:
          type: string
          enum:
            - RIDE_REQUEST_RECEIVED
            - DRIVER_ASSIGNED
            - DRIVER_ARRIVED
            - RIDE_COMPLETED
            - PAYMENT_RESULT
            - RIDE_CHANGED
            - NEW_RIDE_FOR_DRIVER
        channel:
          type: string
          enum: [PUSH, SMS, EMAIL]
          nullable: true
        message:
          type: string

    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [QUEUED, SENT, FAILED]
        sentAt:
          type: string
          format: date-time
          nullable: true

    IncidentRequest:
      type: object
      required: [description]
      properties:
        description:
          type: string
        resolution:
          type: string
          nullable: true
        status:
          type: string
          enum: [OPEN, PROCESSING, RESOLVED]
          default: OPEN

    Incident:
      type: object
      properties:
        id:
          type: string
          format: uuid
        rideId:
          type: string
          format: uuid
        description:
          type: string
        resolution:
          type: string
          nullable: true
        status:
          type: string
          enum: [OPEN, PROCESSING, RESOLVED]
        createdAt:
          type: string
          format: date-time

    Report:
      type: object
      properties:
        reportType:
          type: string
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        data:
          type: object
          additionalProperties: true

    Error:
      type: object
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
          example: Dữ liệu không hợp lệ
        details:
          type: array
          items:
            type: string

    PagedCustomers:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/Customer'

    PagedDrivers:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/Driver'

    PagedRides:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/Ride'

    PagedPayments:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        items:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
